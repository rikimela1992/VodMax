# VodMax with Docker Compose:
#   mkdir vodmax-data && sudo chown 1000:1000 vodmax-data
#   docker compose up -d
# then open http://<server>:8095 and paste the admin token:
#   docker compose exec vodmax cat /var/lib/vodmax/admin.token
# Updating: docker compose pull && docker compose up -d
services:
  vodmax:
    image: ghcr.io/silirim/vodmax:latest
    container_name: vodmax
    restart: unless-stopped
    ports:
      - "8095:8095"
    environment:
      - TZ=Europe/Rome
      # The built-in assistant runs in the "assistant" service below.
      - VODMAX_ASSISTANT_OLLAMA=http://assistant:11434
    volumes:
      # Database, recordings, downloads, backups (owned by uid 1000).
      - ./vodmax-data:/var/lib/vodmax
      # Your movie and series folders, read-only, for the collections.
      - /srv/media:/srv/media:ro
    # Graphics card for video conversion (Settings → System), optional.
    # Intel/AMD: the device and the group that may use it (getent group render).
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "105"
    # NVIDIA (with the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu, video]

  # The built-in assistant (Settings → Assistant), optional. It starts only
  # with  docker compose --profile assistant up -d  and downloads a model
  # (1–9 GB, in ./vodmax-assistant) only when you press "Turn on" in VodMax.
  # No port is published: only VodMax talks to it.
  assistant:
    image: ollama/ollama:0.40.13
    container_name: vodmax-assistant
    profiles: [assistant]
    restart: unless-stopped
    environment:
      - OLLAMA_CONTEXT_LENGTH=8192
    volumes:
      - ./vodmax-assistant:/root/.ollama
