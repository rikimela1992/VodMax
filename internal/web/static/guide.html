<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VodMax · Guida TV</title>
<link rel="stylesheet" href="vod.css">
<link rel="stylesheet" href="guide.css">
</head>
<body>
<header class="top">
  <nav id="tabs">
    <a class="tab focusable" href="/">← Menu</a>
    <a class="tab focusable" href="/tv.html">TV</a>
    <button class="tab focusable" data-list="all">Tutti</button>
    <button class="tab focusable" data-list="favorites">Preferiti</button>
    <button class="tab focusable" data-list="sport">Sport</button>
  </nav>
  <div class="guide-nav">
    <button class="tab focusable" data-move="yesterday">Ieri sera</button>
    <button class="tab focusable" data-move="-2">◀ 2 ore</button>
    <span id="guide-when" class="guide-when"></span>
    <button class="tab focusable" data-move="2">2 ore ▶</button>
    <button class="tab focusable" data-move="now">Adesso</button>
    <button class="tab focusable" data-move="day">Domani sera</button>
  </div>
</header>
<main id="guide" class="guide" aria-live="polite"></main>
<section id="programme" class="programme-panel" hidden></section>
<div id="status" class="status" hidden></div>
<script src="common.js"></script>
<script src="guide.js"></script>
</body>
</html>
