<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VodMax · Impostazioni</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="vod.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<header class="top">

    <a class="tab focusable" href="/" data-icon="arrow-left">Menu</a>
    <button class="tab focusable" data-view="subscriptions" data-icon="layers">Abbonamenti</button>
    <button class="tab focusable" data-view="vpn" data-icon="lock">VPN</button>
    <button class="tab focusable" data-view="rules" data-icon="check">Selezione</button>
    <button class="tab focusable" data-view="categories" data-icon="list">Categorie</button>
    <button class="tab focusable" data-view="guide" data-icon="calendar-days">Guida TV</button>
    <button class="tab focusable" data-view="profiles" data-icon="user">Profili</button>
    <button class="tab focusable" data-view="devices" data-icon="tv">Dispositivi</button>
    <button class="tab focusable" data-view="system" data-icon="settings">Sistema</button>
  </nav>
</header>
<main id="content" class="settings" aria-live="polite"></main>
<div id="status" class="status" hidden></div>
<script src="icons.js"></script>
<script src="common.js"></script>
<script src="settings.js"></script>

</html>
