<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VodMax</title>
<link rel="stylesheet" href="vod.css">
</head>
<body>
<header class="top">
  <nav id="tabs">
    <button class="tab focusable" data-view="home">Home</button>
    <button class="tab focusable" data-view="movie">Film</button>
    <button class="tab focusable" data-view="series">Serie</button>
    <button class="tab focusable" data-view="recordings">Registrazioni</button>
    <a class="tab focusable" href="/tv.html">TV</a>
    <a class="tab focusable" href="/settings.html">Impostazioni</a>
  </nav>
  <input id="search" class="focusable" type="search" placeholder="Cerca film e serie" autocomplete="off" aria-label="Cerca">
</header>

<main id="content" aria-live="polite"></main>

<section id="detail" class="detail" hidden>
  <div class="detail-head">
    <img id="detail-image" alt="" hidden>
    <div>
      <h1 id="detail-title"></h1>
      <p id="detail-meta" class="meta"></p>
      <div id="detail-actions" class="actions"></div>
    </div>
  </div>
  <nav id="seasons" class="seasons"></nav>
  <ol id="episodes" class="episodes"></ol>
</section>

<section id="player" class="player" hidden>
  <video id="video" playsinline></video>
  <div id="player-bar" class="player-bar">
    <div id="player-title" class="player-title"></div>
    <div class="player-progress"><div id="player-fill"></div></div>
    <div class="player-time"><span id="player-pos">0:00</span><span id="player-dur"></span></div>
    <div class="player-buttons">
      <button class="focusable" data-action="close">✕ Chiudi</button>
      <button class="focusable" data-action="back10">⏪ 10 s</button>
      <button class="focusable" data-action="toggle" id="player-toggle">⏸ Pausa</button>
      <button class="focusable" data-action="fwd30">30 s ⏩</button>
      <button class="focusable" data-action="live" id="player-live" hidden>⏭ Torna in diretta</button>
      <button class="focusable" data-action="audio" id="player-audio" hidden>🔊 Audio</button>
      <button class="focusable" data-action="subs" id="player-subs" hidden>💬 Sottotitoli</button>
    </div>
    <div id="player-menu" class="player-menu" hidden></div>
    <div class="hint">OK o Spazio pausa · ◀ −10 s · ▶ +30 s · ▼ comandi · Indietro chiude</div>
  </div>
</section>

<div id="status" class="status" hidden></div>
<script src="vendor/mpegts-1.8.2.min.js"></script>
<script src="common.js"></script>
<script src="vod.js"></script>
</body>
</html>
