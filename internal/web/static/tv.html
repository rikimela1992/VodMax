<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VodMax · TV</title>
<link rel="stylesheet" href="tv.css">
</head>
<body>
<main id="screen">
  <video id="video" autoplay playsinline></video>

  <section id="banner" class="banner" hidden aria-live="polite">
    <div class="banner-head">
      <span id="banner-number" class="number"></span>
      <img id="banner-logo" class="logo" alt="" hidden>
      <span id="banner-name" class="name"></span>
      <span id="banner-badges" class="badges"></span>
      <span id="banner-mode" class="mode"></span>
    </div>
    <div class="programme">
      <span class="label">Ora</span>
      <span id="banner-now" class="title"></span>
      <span id="banner-now-time" class="time"></span>
    </div>
    <div class="progress"><div id="banner-progress"></div></div>
    <div class="programme next">
      <span class="label">A seguire</span>
      <span id="banner-next" class="title"></span>
      <span id="banner-next-time" class="time"></span>
    </div>
    <div id="banner-hint" class="hint"></div>
  </section>

  <section id="controls" class="controls" hidden>
    <button data-action="menu" title="Torna al menu (Indietro)">✕ Menu</button>
    <button data-action="list" title="Elenco dei canali (OK)">☰ Canali</button>
    <button data-action="startOver" title="Dall'inizio del programma">⏮ Dall'inizio</button>
    <button data-action="back10" title="Indietro di 10 secondi (◀)">⏪ 10 s</button>
    <button data-action="toggle" id="ctl-toggle" title="Pausa / riprendi (Spazio)">⏸ Pausa</button>
    <button data-action="fwd30" title="Avanti di 30 secondi (▶)">30 s ⏩</button>
    <button data-action="live" id="ctl-live" title="Torna al punto in diretta">● In diretta</button>
    <button data-action="fav" id="ctl-fav" title="Preferito (Giallo / F)">☆ Preferito</button>
    <button data-action="rec" title="Registra il programma in onda (Blu / R)">⏺ Registra</button>
  </section>

  <section id="list" class="list" hidden>
    <nav id="list-tabs" class="tabs"></nav>
    <ol id="list-items"></ol>
    <p class="hint">OK guarda · ◀ ▶ cambia elenco · Giallo preferito · Blu registra · Indietro chiude</p>
  </section>

  <div id="digits" class="digits" hidden></div>
  <div id="status" class="status" hidden></div>
  <section id="dialog" class="panel dialog" hidden>
    <p id="dialog-text"></p>
    <div class="dialog-buttons">
      <button id="dialog-yes" type="button">Sì</button>
      <button id="dialog-no" type="button">Annulla</button>
    </div>
    <p class="hint">OK per confermare · Indietro per annullare</p>
  </section>
</main>
<script src="vendor/mpegts-1.8.2.min.js"></script>
<script src="vendor/hls-1.7.3.min.js"></script>
<script src="common.js"></script>
<script src="tv.js"></script>
</body>
</html>
